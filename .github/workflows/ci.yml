name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze-test-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env for build
        # `.env` is a required asset (see pubspec.yaml) but is gitignored, so it
        # never exists on the runner. Seed it from the committed template with
        # placeholder values — analysis and tests don't hit a real backend.
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        # Errors and warnings fail the build; info-level lints do not. The
        # codebase deliberately uses relative imports within lib/, which trips
        # `always_use_package_imports` (info only) — intentional, so not fatal.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
